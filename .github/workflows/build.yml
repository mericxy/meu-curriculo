name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            latexmk \
            lmodern \
            poppler-utils \
            texlive-lang-portuguese \
            texlive-latex-base \
            texlive-latex-recommended

      - name: Build all resumes
        run: make todos

      - name: Validate PDFs
        run: |
          pdfinfo main.pdf | grep -q '^Page size:.*A4'
          pdfinfo main.pdf | grep -q '^Pages: *1$'
          pdfinfo main-geral.pdf | grep -q '^Page size:.*A4'
          pdfinfo main-geral.pdf | grep -q '^Pages: *1$'
          pdftotext main.pdf - | grep -q 'Resumo Profissional'
          pdftotext main-geral.pdf - | grep -q 'Resumo Profissional'

      - name: Validate static API
        run: |
          ruby -rjson -e '
            data = JSON.parse(File.read("dist/api/v1/curriculo.json"))
            abort "schemaVersion invalido" unless data["schemaVersion"] == 1
            abort "locale pt-BR ausente" unless data.dig("locales", "pt-BR")
            abort "locale en ausente" unless data.dig("locales", "en")
          '

  deploy-api:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Generate static API
        run: make api

      - name: Deploy static API
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"

      - name: Verify published API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              https://api.meric.dev.br/v1/curriculo.json \
              --output /tmp/curriculo.json \
              && ruby -rjson -e '
                data = JSON.parse(File.read("/tmp/curriculo.json"))
                abort unless data.dig("source", "commit") == ENV.fetch("GITHUB_SHA")
              '; then
              exit 0
            fi

            sleep 10
          done

          exit 1

      - name: Rebuild portfolio
        env:
          PORTFOLIO_DEPLOY_HOOK_URL: ${{ secrets.PORTFOLIO_DEPLOY_HOOK_URL }}
        run: |
          test -n "$PORTFOLIO_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            "$PORTFOLIO_DEPLOY_HOOK_URL"
